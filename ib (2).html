<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易员专属开户与跟单导航平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .modal-transition {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2 rounded-xl text-white shadow-md">
                    <i class="fa-solid me-0 fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-slate-900" id="headerTitle">专业交易服务中心</h1>
                    <p class="text-xs text-slate-500 mt-0.5" id="headerSub">官方 IB 合作通道 & 跟单社区</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- 语言切换按钮 -->
                <button onclick="toggleLanguage()" class="inline-flex items-center space-x-1.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
                    <i class="fa-solid fa-globe text-blue-600"></i>
                    <span id="langBtnText">English</span>
                </button>

                <!-- 管理后台触发按钮 -->
                <button onclick="toggleAdminModal(true)" class="inline-flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
                    <i class="fa-solid fa-gear text-slate-500"></i>
                    <span class="hidden sm:inline" id="adminBtnText">管理我的链接</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 横幅（Banner） -->
    <section class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <span class="inline-block px-3 py-1 bg-blue-500/20 text-blue-300 rounded-full text-xs font-semibold tracking-wide uppercase mb-3 border border-blue-500/30" id="bannerBadge">
                一站式交易连接
            </span>
            <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight mb-3" id="bannerHeading">
                选择您的合作券商，开启高效交易
            </h2>
            <p class="text-slate-300 text-sm sm:text-base max-w-2xl mx-auto leading-relaxed" id="bannerSub">
                点击下方对应券商图示，即可通过官方独家专属通道完成开户或一键绑定跟单账户。
            </p>
        </div>
    </section>

    <!-- 主体区域：券商卡片展示网格 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- 标签页/分类过滤 -->
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-lg font-bold text-slate-800 flex items-center">
                <i class="fa-solid fa-shield-halved text-blue-600 mr-2"></i> <span id="sectionTitle">合作券商列表</span>
            </h3>
            <span class="text-xs text-slate-500" id="brokerCount">共 0 家支持券商</span>
        </div>

        <!-- 列表为空提示 -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border-2 border-dashed border-slate-200">
            <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
            <h3 class="text-base font-semibold text-slate-700" id="emptyTitle">暂无配置的券商</h3>
            <p class="text-xs text-slate-500 mt-1 mb-4" id="emptySub">请登录后台管理系统添加您的第一个 IB 或跟单链接。</p>
            <button onclick="toggleAdminModal(true)" class="px-4 py-2 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-700 transition" id="emptyBtn">
                前往配置链接
            </button>
        </div>

        <!-- 卡片展示区 -->
        <div id="brokerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 动态填充 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 space-y-2">
            <p>© <span id="year"></span> <span id="footerCopy">交易员导航平台. All rights reserved.</span></p>
            <p class="text-slate-400" id="riskWarning">免责声明：高杠杆衍生品交易具有高风险，可能不适合所有投资者。请确保在交易前完全了解相关风险。</p>
        </div>
    </footer>

    <!-- 管理控制台 Modal -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 modal-transition">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <!-- Modal 头部 -->
            <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-blue-400"></i>
                    <h3 class="font-bold text-base" id="modalTitle">链接后台管理面板</h3>
                </div>
                <button onclick="toggleAdminModal(false)" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal 内容 -->
            <div class="p-6 overflow-y-auto flex-grow space-y-6">
                <!-- 基础设置 -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <h4 class="font-bold text-xs uppercase tracking-wider text-slate-500 flex items-center">
                        <i class="fa-solid fa-pen-to-square mr-1.5"></i> 站点标题设置 (主页 / Banner)
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">中文主页标题</label>
                            <input type="text" id="inputSiteTitle" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">英文主页标题 (English Title)</label>
                            <input type="text" id="inputSiteTitleEn" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">中文大标题 (Banner)</label>
                            <input type="text" id="inputBannerHeading" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">英文大标题 (English Banner)</label>
                            <input type="text" id="inputBannerHeadingEn" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- 新增 / 编辑券商表单 -->
                <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-xs uppercase tracking-wider text-blue-700 flex items-center">
                            <i class="fa-solid fa-plus-circle mr-1.5"></i> <span id="formTitle">添加新券商卡片</span>
                        </h4>
                        <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-slate-500 hover:text-slate-700 underline">
                            取消编辑
                        </button>
                    </div>

                    <input type="hidden" id="editIndex" value="-1">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">券商名称 *</label>
                            <input type="text" id="brokerName" placeholder="例如：XM, Exness, IC Markets" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">标志 (Logo) 图片地址 URL</label>
                            <input type="url" id="brokerLogo" placeholder="https://example.com/logo.png" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">中文简短描述</label>
                            <input type="text" id="brokerDesc" placeholder="例如：点差极低，极速出入金" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">英文简短描述 (English Desc)</label>
                            <input type="text" id="brokerDescEn" placeholder="e.g. Ultra-low spread, instant withdrawal" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">IB 开户链接 (注册/开户)</label>
                            <input type="url" id="ibUrl" placeholder="https://your-ib-link.com" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">跟单/信号社区链接</label>
                            <input type="url" id="copyUrl" placeholder="https://your-copy-trading-link.com" class="w-full text-xs px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    
                    <button onclick="saveBroker()" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs rounded-lg shadow transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span id="saveBtnText">保存券商信息</span>
                    </button>
                </div>

                <!-- 现有券商列表 -->
                <div>
                    <h4 class="font-bold text-xs uppercase tracking-wider text-slate-500 mb-2 flex items-center">
                        <i class="fa-solid fa-list mr-1.5"></i> 已添加的券商列表
                    </h4>
                    <div id="adminBrokerList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- 动态管理条目 -->
                    </div>
                </div>
            </div>

            <!-- Modal 底部 -->
            <div class="px-6 py-3 bg-slate-100 border-t border-slate-200 flex justify-between items-center">
                <button onclick="resetToDefault()" class="text-xs text-rose-600 hover:text-rose-800 font-medium">
                    恢复默认预设
                </button>
                <button onclick="saveSiteSettings(); toggleAdminModal(false);" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg transition">
                    完成并关闭
                </button>
            </div>
        </div>
    </div>

    <!-- 消息 Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400" id="toastIcon"></i>
        <span id="toastMsg">操作成功</span>
    </div>

    <!-- 应用逻辑 JavaScript -->
    <script>
        // 国际化文本定义 (i18n)
        const i18n = {
            zh: {
                langBtn: "English",
                adminBtn: "管理我的链接",
                headerSub: "官方 IB 合作通道 & 跟单社区",
                bannerBadge: "一站式交易连接",
                sectionTitle: "合作券商列表",
                brokerCountText: (count) => `共 ${count} 家支持券商`,
                openAccount: "通过专属通道开户",
                copyTrading: "一键跟单 / 绑定信号",
                noLinks: "暂未配置生效链接",
                emptyTitle: "暂无配置的券商",
                emptySub: "请登录后台管理系统添加您的第一个 IB 或跟单链接。",
                emptyBtn: "前往配置链接",
                footerCopy: "交易员导航平台. All rights reserved.",
                riskWarning: "免责声明：高杠杆衍生品交易具有高风险，可能不适合所有投资者。请确保在交易前完全了解相关风险。",
                officialPartner: "官方认证 Partner"
            },
            en: {
                langBtn: "中文",
                adminBtn: "Manage Links",
                headerSub: "Official IB Channel & Copy Trading",
                bannerBadge: "One-Stop Trading Hub",
                sectionTitle: "Partner Brokers",
                brokerCountText: (count) => `${count} Supported Brokers`,
                openAccount: "Open Live Account",
                copyTrading: "Copy Trading / Signal",
                noLinks: "No active links configured",
                emptyTitle: "No Brokers Configured",
                emptySub: "Please log into the admin panel to add your first broker link.",
                emptyBtn: "Go to Admin Panel",
                footerCopy: "Trader Hub. All rights reserved.",
                riskWarning: "Risk Warning: Leveraged trading carries a high level of risk to your capital and may not be suitable for all investors.",
                officialPartner: "Verified Partner"
            }
        };

        // 当前语言 (默认 zh)
        let currentLang = localStorage.getItem('app_lang') || 'zh';

        // 默认初始化数据
        const DEFAULT_DATA = {
            siteTitle: "专业交易服务中心",
            siteTitleEn: "Pro Trader Portal",
            bannerHeading: "选择您的合作券商，开启高效交易",
            bannerHeadingEn: "Choose Your Partner Broker & Start Trading",
            brokers: [
                {
                    name: "Vantage Markets",
                    logo: "https://placehold.co/200x80/0f172a/ffffff?text=Vantage+Markets",
                    desc: "全球知名老牌交易商，超低点差环境，极速出入金与高额返佣支持",
                    descEn: "Global multi-asset broker offering ultra-low spreads, fast execution, and top rebate support.",
                    ibUrl: "https://www.vantagemarketsea.com/ms/open-live-account/?affid=NzEwNTM=&invitecode=rebatefun01",
                    copyUrl: "https://www.vantagemarketsea.com/ms/copy-trading/"
                },
                {
                    name: "Zeal Capital Markets",
                    logo: "https://placehold.co/200x80/003366/ffffff?text=ZFX+Zeal",
                    desc: "ZFX 山海证券，机构级流动性支持，安全合规，多元化资产交易",
                    descEn: "ZFX provides institutional liquidity, multi-asset trading, and regulated security.",
                    ibUrl: "https://www.cn-zfx.com/",
                    copyUrl: "https://www.cn-zfx.com/"
                },
                {
                    name: "Exness",
                    logo: "https://placehold.co/200x80/f8fafc/0f172a?text=EXNESS",
                    desc: "点差低至0.0，杠杆灵活，24/7极速出入金支持",
                    descEn: "Spreads from 0.0, flexible leverage, and 24/7 instant withdrawals.",
                    ibUrl: "https://www.exness.com",
                    copyUrl: "https://social-trading.exness.com"
                },
                {
                    name: "XM Global",
                    logo: "https://placehold.co/200x80/f8fafc/0f172a?text=XM+Group",
                    desc: "老牌国际监管券商，赠金活动丰富，优质交易环境",
                    descEn: "Regulated broker with rich promotional bonuses and exceptional execution.",
                    ibUrl: "https://www.xm.com",
                    copyUrl: "https://copytrading.xm.com"
                },
                {
                    name: "IC Markets",
                    logo: "https://placehold.co/200x80/f8fafc/0f172a?text=IC+Markets",
                    desc: "真正ECN点差环境，适合量化EA与高频策略交易者",
                    descEn: "True ECN connectivity designed for algorithmic and high-frequency traders.",
                    ibUrl: "https://www.icmarkets.com",
                    copyUrl: ""
                }
            ]
        };

        // 从 LocalStorage 加载数据或使用默认数据
        let appData = JSON.parse(localStorage.getItem('broker_nav_data')) || DEFAULT_DATA;

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            renderApp();
        });

        // 切换语言
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('app_lang', currentLang);
            renderApp();
        }

        // 渲染整个应用程序
        function renderApp() {
            const txt = i18n[currentLang];

            // 渲染固定UI节点语言
            document.getElementById('langBtnText').textContent = txt.langBtn;
            document.getElementById('adminBtnText').textContent = txt.adminBtn;
            document.getElementById('headerSub').textContent = txt.headerSub;
            document.getElementById('bannerBadge').textContent = txt.bannerBadge;
            document.getElementById('sectionTitle').textContent = txt.sectionTitle;
            document.getElementById('emptyTitle').textContent = txt.emptyTitle;
            document.getElementById('emptySub').textContent = txt.emptySub;
            document.getElementById('emptyBtn').textContent = txt.emptyBtn;
            document.getElementById('footerCopy').textContent = txt.footerCopy;
            document.getElementById('riskWarning').textContent = txt.riskWarning;

            // 渲染动态标题与 Banner
            const siteTitle = (currentLang === 'en' && appData.siteTitleEn) ? appData.siteTitleEn : (appData.siteTitle || DEFAULT_DATA.siteTitle);
            const bannerHeading = (currentLang === 'en' && appData.bannerHeadingEn) ? appData.bannerHeadingEn : (appData.bannerHeading || DEFAULT_DATA.bannerHeading);
            
            document.getElementById('headerTitle').textContent = siteTitle;
            document.getElementById('bannerHeading').textContent = bannerHeading;
            
            // 后台表单值同步
            document.getElementById('inputSiteTitle').value = appData.siteTitle || DEFAULT_DATA.siteTitle;
            document.getElementById('inputSiteTitleEn').value = appData.siteTitleEn || DEFAULT_DATA.siteTitleEn;
            document.getElementById('inputBannerHeading').value = appData.bannerHeading || DEFAULT_DATA.bannerHeading;
            document.getElementById('inputBannerHeadingEn').value = appData.bannerHeadingEn || DEFAULT_DATA.bannerHeadingEn;

            // 渲染主网格卡片
            const grid = document.getElementById('brokerGrid');
            const emptyState = document.getElementById('emptyState');
            const brokerCount = document.getElementById('brokerCount');

            grid.innerHTML = '';
            brokerCount.textContent = txt.brokerCountText(appData.brokers.length);

            if (appData.brokers.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                appData.brokers.forEach((broker, index) => {
                    grid.appendChild(createBrokerCard(broker, index));
                });
            }

            // 渲染后台管理列表
            renderAdminBrokerList();
        }

        // 创建前台券商展示卡片
        function createBrokerCard(broker, index) {
            const txt = i18n[currentLang];
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl border border-slate-200/80 p-6 flex flex-col justify-between card-hover relative overflow-hidden group";

            const logoUrl = broker.logo || `https://placehold.co/200x80/f8fafc/0f172a?text=${encodeURIComponent(broker.name)}`;
            const description = (currentLang === 'en' && broker.descEn) ? broker.descEn : (broker.desc || '');

            card.innerHTML = `
                <div>
                    <!-- Logo 区域 -->
                    <div class="h-20 bg-slate-50 rounded-xl p-3 flex items-center justify-center mb-4 border border-slate-100 group-hover:bg-blue-50/30 transition">
                        <img src="${logoUrl}" alt="${broker.name} Logo" 
                             class="max-h-full max-w-full object-contain filter drop-shadow-sm" 
                             onerror="this.onerror=null; this.src='https://placehold.co/200x80/f8fafc/0f172a?text=${encodeURIComponent(broker.name)}'">
                    </div>

                    <!-- 标题与描述 -->
                    <h4 class="text-lg font-bold text-slate-900 mb-1 flex items-center justify-between">
                        ${broker.name}
                        <i class="fa-solid fa-circle-check text-blue-500 text-sm" title="${txt.officialPartner}"></i>
                    </h4>
                    <p class="text-xs text-slate-500 leading-relaxed mb-6">
                        ${description || 'Professional trading services with instant execution.'}
                    </p>
                </div>

                <!-- 操作按钮组 -->
                <div class="space-y-2 pt-2 border-t border-slate-100">
                    ${broker.ibUrl ? `
                        <a href="${broker.ibUrl}" target="_blank" rel="noopener noreferrer" 
                           class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-xs rounded-xl shadow-sm hover:shadow transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>${txt.openAccount}</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70"></i>
                        </a>
                    ` : ''}

                    ${broker.copyUrl ? `
                        <a href="${broker.copyUrl}" target="_blank" rel="noopener noreferrer" 
                           class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-copy text-indigo-600"></i>
                            <span>${txt.copyTrading}</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70"></i>
                        </a>
                    ` : ''}

                    ${!broker.ibUrl && !broker.copyUrl ? `
                        <div class="text-center py-2 text-xs text-slate-400 bg-slate-50 rounded-xl">
                            ${txt.noLinks}
                        </div>
                    ` : ''}
                </div>
            `;
            return card;
        }

        // 渲染后台列表
        function renderAdminBrokerList() {
            const list = document.getElementById('adminBrokerList');
            list.innerHTML = '';

            appData.brokers.forEach((broker, index) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-2.5 bg-slate-50 rounded-lg border border-slate-200 text-xs";
                item.innerHTML = `
                    <div class="flex items-center space-x-2 truncate pr-2">
                        <span class="font-bold text-slate-800">${broker.name}</span>
                        <span class="text-slate-400 text-[10px] truncate">(${broker.ibUrl ? 'IB✓' : 'IB✕'} | ${broker.copyUrl ? 'Copy✓' : 'Copy✕'})</span>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button onclick="editBroker(${index})" class="p-1.5 text-blue-600 hover:bg-blue-100 rounded transition" title="编辑">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteBroker(${index})" class="p-1.5 text-rose-600 hover:bg-rose-100 rounded transition" title="删除">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // 保存/更新单条券商
        function saveBroker() {
            const name = document.getElementById('brokerName').value.trim();
            const logo = document.getElementById('brokerLogo').value.trim();
            const desc = document.getElementById('brokerDesc').value.trim();
            const descEn = document.getElementById('brokerDescEn').value.trim();
            const ibUrl = document.getElementById('ibUrl').value.trim();
            const copyUrl = document.getElementById('copyUrl').value.trim();
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!name) {
                showToast("请输入券商名称！", "error");
                return;
            }

            const brokerData = { name, logo, desc, descEn, ibUrl, copyUrl };

            if (editIndex >= 0) {
                appData.brokers[editIndex] = brokerData;
                showToast("券商信息更新成功！");
            } else {
                appData.brokers.push(brokerData);
                showToast("新券商已成功添加！");
            }

            saveToLocalStorage();
            resetForm();
            renderApp();
        }

        // 编辑券商
        function editBroker(index) {
            const broker = appData.brokers[index];
            document.getElementById('brokerName').value = broker.name || '';
            document.getElementById('brokerLogo').value = broker.logo || '';
            document.getElementById('brokerDesc').value = broker.desc || '';
            document.getElementById('brokerDescEn').value = broker.descEn || '';
            document.getElementById('ibUrl').value = broker.ibUrl || '';
            document.getElementById('copyUrl').value = broker.copyUrl || '';
            document.getElementById('editIndex').value = index;

            document.getElementById('formTitle').textContent = "编辑券商信息";
            document.getElementById('saveBtnText').textContent = "更新券商信息";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        // 删除券商
        function deleteBroker(index) {
            if (confirm(`确定要删除 ${appData.brokers[index].name} 吗？`)) {
                appData.brokers.splice(index, 1);
                saveToLocalStorage();
                renderApp();
                showToast("已删除该券商卡片");
            }
        }

        // 重置编辑表单
        function resetForm() {
            document.getElementById('brokerName').value = '';
            document.getElementById('brokerLogo').value = '';
            document.getElementById('brokerDesc').value = '';
            document.getElementById('brokerDescEn').value = '';
            document.getElementById('ibUrl').value = '';
            document.getElementById('copyUrl').value = '';
            document.getElementById('editIndex').value = '-1';

            document.getElementById('formTitle').textContent = "添加新券商卡片";
            document.getElementById('saveBtnText').textContent = "保存券商信息";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        // 保存全局站点设置
        function saveSiteSettings() {
            appData.siteTitle = document.getElementById('inputSiteTitle').value.trim();
            appData.siteTitleEn = document.getElementById('inputSiteTitleEn').value.trim();
            appData.bannerHeading = document.getElementById('inputBannerHeading').value.trim();
            appData.bannerHeadingEn = document.getElementById('inputBannerHeadingEn').value.trim();
            saveToLocalStorage();
            renderApp();
            showToast("站点配置已保存！");
        }

        // 重置为预设数据
        function resetToDefault() {
            if (confirm("确定要恢复默认预设吗？您自定义的配置将被清空。")) {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveToLocalStorage();
                resetForm();
                renderApp();
                showToast("已恢复默认预设配置");
            }
        }

        // 保存至浏览器本地存储
        function saveToLocalStorage() {
            localStorage.setItem('broker_nav_data', JSON.stringify(appData));
        }

        // 开关管理 Modal 弹窗
        function toggleAdminModal(show) {
            const modal = document.getElementById('adminModal');
            if (show) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        // Toast 消息提示
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
